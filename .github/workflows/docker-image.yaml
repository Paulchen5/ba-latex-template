name: Build and Push Docker Images
on:
  push:
    branches:
      - main
      - docker
jobs:
  build_and_push:
    runs-on: ubuntu-latest
    env:
      VERSION: ""
      IMAGE: ""
      USER_NAME: ""
      USER_EMAIL: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set image version
        run: echo "VERSION=$(git rev-parse --short=8 HEAD)" >> $GITHUB_ENV
      - name: Set image name
        run: echo "IMAGE=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      - name: Get user name and email
        run: |
          echo "USER_NAME=$(git log -1 --pretty=format:'%an')" >> $GITHUB_ENV
          echo "USER_EMAIL=$(git log -1 --pretty=format:'%ae')" >> $GITHUB_ENV
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Log in to ghcr.io
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          labels: |
            org.opencontainers.image.title=Docker Image of BA LaTeX Template \
            org.opencontainers.image.authors=${{ env.USER_NAME }} <${{ env.USER_EMAIL }}> \
            org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            org.opencontainers.image.licenses=The Unlicense
            org.opencontainers.image.description=Docker image containing a LaTeX template
          #            org.opencontainers.image.description=Docker image containing a LaTeX template aligned with the DHSN Dresden Styleguide. TEXINPUTS is preconfigured to include the template.
          platforms: linux/arm64/v8,linux/amd64
          push: true
          tags: ghcr.io/${{ env.IMAGE }}:latest,ghcr.io/${{ env.IMAGE }}:${{ env.VERSION }}
